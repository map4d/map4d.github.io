<!DOCTYPE html>
<html>

<head>
  <script defer
    src="https://api.ipostmap.vn/sdk/map/js?version=2.6&key=b04d0b87b0c7c5f5d9f3b97364ba2904&callback=initMap"></script>
</head>

<body>
  <div id="map"></div>
  <script>
    function initMap() {
      let options = {
        center: { lat: 16.072163491469226, lng: 108.22690536081757 },
        zoom: 15,
        controls: true,
        cooperativeGestures: true
      }
      let map = new ipostmap.Map(document.getElementById("map"), options)

      map.addListener(
        "click",
        function (args) {
          let marker = new ipostmap.Marker({
            position: args.location
          })
          marker.setMap(map)
        }
      )
    }
  </script>
  <style>
    #map {
      height: 100%;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
</body>

</html>
